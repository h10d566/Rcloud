<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rcloud - التخزين السحابي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>☁️ Rcloud</h1>
                <p>تخزين سحابي آمن ومجاني</p>
            </div>
        </header>

        <div class="upload-area" id="uploadArea">
            <div class="upload-content">
                <span class="upload-icon">📁</span>
                <h3>اسحب وأفلت الملفات هنا</h3>
                <p>أو <span class="browse-btn">اختر من جهازك</span></p>
                <input type="file" id="fileInput" multiple style="display: none;">
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <span class="stat-icon">📊</span>
                <div class="stat-info">
                    <h3 id="totalFiles">0</h3>
                    <p>عدد الملفات</p>
                </div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">💾</span>
                <div class="stat-info">
                    <h3 id="totalSize">0 MB</h3>
                    <p>الحجم المستخدم</p>
                </div>
            </div>
        </div>

        <div class="files-section">
            <div class="section-header">
                <h2>📂 ملفاتك</h2>
                <button class="btn-refresh" id="refreshBtn">🔄 تحديث</button>
            </div>
            <div id="filesList" class="files-list">
                <!-- الملفات تظهر هنا -->
            </div>
        </div>
    </div>

    <!-- ✅ هذان السكريبتان المهمان -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
